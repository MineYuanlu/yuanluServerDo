  #      <artifactId>mockbukkit-v1.21</artifactId>
  #      <version>4.x</version>
  #      <scope>test</scope>
  #    </dependency>
  #
  # 2. 编写测试用例：
  #    - 插件加载/卸载测试
  #    - 命令解析测试
  #    - 跨服消息协议编解码测试 (Channel.java)
